<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partner Portal | SGS SOLUTIONS</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;background:#f2f5eb;color:#1e3021;font-family:Arial,sans-serif}.card{width:100%;max-width:560px;background:#fff;padding:clamp(22px,5vw,36px);border-radius:20px;box-shadow:0 12px 35px #00000012}.logo{font-size:23px;font-weight:900}.logo span{color:#82ad24}h1{font-size:clamp(25px,5vw,32px);margin:25px 0 8px}.sub{color:#687368;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}label{display:block;margin:14px 0 7px;font-size:14px;font-weight:700}input,select,textarea{width:100%;min-width:0;padding:13px;border:1px solid #d6ddcf;border-radius:9px;font:inherit;outline-color:#82ad24;background:#fff}textarea{resize:vertical}button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:9px;background:#c5eb70;color:#1e3021;font-weight:800;font-size:15px;cursor:pointer}.switch{background:#edf2e7;margin-top:10px}.message{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:14px}.back{display:block;text-align:center;margin-top:20px;color:#45651d}.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;margin-top:16px}.consent input{width:auto;margin-top:3px}@media(max-width:520px){body{padding:12px;align-items:start}.card{margin:auto 0;padding:22px 18px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body><main class="card"><div class="logo">☀ SGS <span>SOLUTIONS</span></div><h1 id="title">Partner Login</h1><p class="sub" id="subtitle">Sign in to access your approved partner portal.</p>
<form id="partnerForm"><div id="registrationFields" hidden>
<div class="grid"><div class="full"><label for="name">Full name *</label><input id="name" autocomplete="name" maxlength="120"></div>
<div><label for="email">Email *</label><input id="email" type="email" autocomplete="email"></div><div><label for="phone">Mobile number *</label><input id="phone" type="tel" autocomplete="tel"></div>
<div><label for="city">City *</label><input id="city" autocomplete="address-level2"></div><div><label for="area">Area / PIN code</label><input id="area" autocomplete="postal-code"></div>
<div><label for="partnerType">Partner type *</label><select id="partnerType"><option value="">Select type</option><option value="Installation Partner">Installation Partner</option><option value="Service Partner">Service Partner</option><option value="Sales Partner">Sales Partner</option><option value="Dealer / Distributor">Dealer / Distributor</option></select></div>
<div><label for="businessName">Business name</label><input id="businessName" autocomplete="organization"></div>
<div class="full"><label for="experience">Experience</label><input id="experience" placeholder="e.g. 3 years solar installation"></div>
<div class="full"><label for="partnerMessage">Tell us about your work</label><textarea id="partnerMessage" rows="3"></textarea></div></div>
<label class="consent"><input id="consent" type="checkbox"><span>I confirm the information is accurate and agree that SGS SOLUTIONS may contact me about this partner application.</span></label></div>
<div id="loginFields"><label for="identifier">Email or mobile number *</label><input id="identifier" autocomplete="username" required></div>
<label for="password">Password *</label><input id="password" type="password" minlength="8" autocomplete="current-password" required>
<button id="submitBtn" type="submit">Login to Partner Portal</button></form>
<button class="switch" id="switchBtn" type="button">New partner? Create an account</button><p class="message" id="message" role="status"></p>
<a class="back" href="/">← Back to SGS SOLUTIONS</a><p class="sub" style="font-size:12px">Partner registrations require admin approval before portal access is enabled.</p></main>
<script>
const $=id=>document.getElementById(id);let mode='login';
function setMode(next){mode=next;const reg=mode==='register';$('title').textContent=reg?'Partner Registration':'Partner Login';$('subtitle').textContent=reg?'Apply to become an SGS SOLUTIONS partner. Admin approval is required.':'Sign in to access your approved partner portal.';$('registrationFields').hidden=!reg;$('loginFields').hidden=reg;$('identifier').required=!reg;$('name').required=reg;$('email').required=reg;$('phone').required=reg;$('city').required=reg;$('partnerType').required=reg;$('consent').required=reg;$('submitBtn').textContent=reg?'Submit Partner Application':'Login to Partner Portal';$('switchBtn').textContent=reg?'Already applied? Login':'New partner? Create an account';$('message').textContent='';$('password').autocomplete=reg?'new-password':'current-password'}
$('switchBtn').addEventListener('click',()=>setMode(mode==='login'?'register':'login'));
$('partnerForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('submitBtn');b.disabled=true;$('message').textContent='Please wait...';try{let endpoint,payload;if(mode==='register'){endpoint='/api/partners/register';payload={name:$('name').value.trim(),email:$('email').value.trim(),phone:$('phone').value.trim(),city:$('city').value.trim(),area:$('area').value.trim(),partnerType:$('partnerType').value,businessName:$('businessName').value.trim(),experience:$('experience').value.trim(),message:$('partnerMessage').value.trim(),password:$('password').value,consent:$('consent').checked};}else{endpoint='/api/auth/login';payload={identifier:$('identifier').value.trim(),password:$('password').value};}const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed.');if(mode==='register'){$('message').textContent=(data.message||'Application submitted.')+(data.referralCode?' Your referral code: '+data.referralCode:'');$('partnerForm').reset();setMode('login');return;}if(!data.user||data.user.role!=='partner'||!data.token)throw new Error('This is not a partner account. Use the correct portal.');localStorage.setItem('sgs_token',data.token);localStorage.setItem('sgs_user',JSON.stringify(data.user));$('message').textContent='Login successful. Opening your dashboard…';setTimeout(()=>{window.location.href='/';},450);}catch(err){$('message').textContent=err.message||'Unable to connect to the server.';}finally{b.disabled=false;}});
</script></body></html>
